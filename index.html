<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Chikuu ❤️</title>

    <style>
        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #f7f2eb;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =====================================================
           WORLD
        ===================================================== */

        .world {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 18% 22%,
                    rgba(100, 90, 85, 0.045) 0 1px,
                    transparent 1.5px
                ),
                radial-gradient(
                    circle at 82% 72%,
                    rgba(100, 90, 85, 0.045) 0 1px,
                    transparent 1.5px
                ),
                #f7f2eb;
        }


        /* =====================================================
           PERMANENT FRAME
        ===================================================== */

        .frame {
            position: fixed;
            inset: 7px;

            border: 1px solid rgba(116, 20, 35, 0.45);

            pointer-events: none;

            z-index: 200;
        }


        /* =====================================================
           BACKGROUND DECOR
        ===================================================== */

        .background-decor {
            position: absolute;
            inset: 0;

            pointer-events: none;

            opacity: 0.23;
        }

        .bg-symbol {
            position: absolute;

            color: #756d69;

            user-select: none;
        }

        .symbol-1 {
            top: 12%;
            left: 10%;
            font-size: 20px;
        }

        .symbol-2 {
            top: 17%;
            right: 12%;
            font-size: 17px;
        }

        .symbol-3 {
            bottom: 18%;
            left: 14%;
            font-size: 18px;
        }

        .symbol-4 {
            bottom: 13%;
            right: 10%;
            font-size: 20px;
        }

        .symbol-5 {
            top: 48%;
            left: 4%;
            font-size: 12px;
        }

        .symbol-6 {
            top: 56%;
            right: 5%;
            font-size: 13px;
        }


        /* =====================================================
           OPENING MESSAGE
        ===================================================== */

        .opening-content {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;

            z-index: 10;
        }

        .message {
            opacity: 0;

            transform: translateY(18px);

            transition:
                opacity 1s ease,
                transform 1s cubic-bezier(0.2, 0.75, 0.25, 1);
        }

        .message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .message h1 {
            color: #741626;

            font-family:
                "Brush Script MT",
                "Segoe Script",
                "Lucida Handwriting",
                cursive;

            font-size: clamp(34px, 7vw, 78px);

            font-weight: 500;

            line-height: 1.05;

            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 18px;

            color: #514846;

            font-family:
                "Segoe Script",
                "Lucida Handwriting",
                cursive;

            font-size: clamp(16px, 3vw, 28px);

            line-height: 1.4;
        }

        .love-line {
            margin-top: 13px;

            color: #741626;

            font-family:
                "Segoe Script",
                "Lucida Handwriting",
                cursive;

            font-size: clamp(18px, 3.5vw, 31px);
        }


        /* =====================================================
           FALLING DECORATIONS
        ===================================================== */

        .falling-layer {
            position: absolute;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            opacity: 0;

            transition: opacity 0.7s ease;

            z-index: 8;
        }

        .falling-layer.visible {
            opacity: 1;
        }

        .falling-item {
            position: absolute;
            top: -60px;

            animation:
                fall
                var(--duration)
                linear
                var(--delay)
                infinite;
        }

        @keyframes fall {

            0% {
                transform:
                    translate3d(0, -60px, 0)
                    rotate(0deg);
            }

            100% {
                transform:
                    translate3d(var(--drift), 110vh, 0)
                    rotate(var(--rotation));
            }
        }

        .heart {
            color: #8a2336;
            font-size: 18px;
        }

        .star {
            color: #756d69;
            font-size: 14px;
        }

        .confetti {
            width: 6px;
            height: 14px;

            border-radius: 2px;

            background: #8a2336;
        }


        /* =====================================================
           MASTER CURTAIN SYSTEM
           
           IMPORTANT:
           This exact block is also used on certificate.html.
           
           DO NOT CHANGE THE WIDTH/HEIGHT THERE.
        ===================================================== */

        .curtain-system {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            pointer-events: none;

            z-index: 100;
        }

        .curtain {
            position: absolute;

            top: 0;

            width: 50vw;
            height: 100vh;

            background:
                linear-gradient(
                    90deg,

                    #4b0613 0%,
                    #711023 7%,
                    #a41f37 15%,
                    #631021 23%,
                    #a9203a 31%,
                    #650f20 40%,
                    #9e1d34 49%,
                    #5a0b1a 58%,
                    #941a31 68%,
                    #640e1e 78%,
                    #a11e36 88%,
                    #550816 100%
                );

            box-shadow:
                inset 0 0 35px rgba(0, 0, 0, 0.28),
                inset 0 0 90px rgba(0, 0, 0, 0.13);

            will-change: transform;
        }

        .curtain-left {
            left: 0;
        }

        .curtain-right {
            right: 0;
        }


        /* =====================================================
           CURTAIN FOLD LIGHT
        ===================================================== */

        .curtain::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,

                    transparent 0%,
                    rgba(255,255,255,0.08) 9%,
                    transparent 17%,

                    rgba(255,255,255,0.06) 29%,
                    transparent 38%,

                    rgba(255,255,255,0.07) 51%,
                    transparent 61%,

                    rgba(255,255,255,0.06) 74%,
                    transparent 84%,

                    rgba(255,255,255,0.05) 94%,
                    transparent 100%
                );
        }


        /* =====================================================
           GOLD BOTTOM HEM
        ===================================================== */

        .curtain::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 9px;

            background:
                linear-gradient(
                    180deg,
                    #d5b76a,
                    #a98535,
                    #e0c67b
                );

            box-shadow:
                0 -2px 6px rgba(0, 0, 0, 0.16);
        }


        /* =====================================================
           OPENING
        ===================================================== */

        .curtain.open {
            transition:
                transform 1.9s cubic-bezier(0.76, 0, 0.18, 1);
        }

        .curtain-left.open {
            transform: translate3d(-100%, 0, 0);
        }

        .curtain-right.open {
            transform: translate3d(100%, 0, 0);
        }


        /* =====================================================
           CLOSING
        ===================================================== */

        .curtain.closing {
            transition:
                transform 2.2s cubic-bezier(0.55, 0.08, 0.20, 1);
        }

        .curtain-left.closing {
            transform: translate3d(0, 0, 0);
        }

        .curtain-right.closing {
            transform: translate3d(0, 0, 0);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .frame {
                inset: 5px;
            }

            .message {
                width: 90%;
            }

            .message h1 {
                font-size: clamp(32px, 10vw, 55px);
            }
        }

    </style>
</head>


<body>

    <main class="world">

        <!-- FRAME -->

        <div class="frame"></div>


        <!-- BACKGROUND -->

        <div class="background-decor">

            <span class="bg-symbol symbol-1">♡</span>
            <span class="bg-symbol symbol-2">✦</span>
            <span class="bg-symbol symbol-3">☾</span>
            <span class="bg-symbol symbol-4">♡</span>
            <span class="bg-symbol symbol-5">✧</span>
            <span class="bg-symbol symbol-6">♡</span>

        </div>


        <!-- FALLING DECOR -->

        <div class="falling-layer" id="fallingLayer">

            <span
                class="falling-item heart"
                style="
                    left: 8%;
                    --duration: 5.8s;
                    --delay: 0s;
                    --drift: 30px;
                    --rotation: 120deg;
                "
            >♥</span>

            <span
                class="falling-item star"
                style="
                    left: 18%;
                    --duration: 7s;
                    --delay: 1.2s;
                    --drift: -25px;
                    --rotation: 180deg;
                "
            >✦</span>

            <span
                class="falling-item heart"
                style="
                    left: 31%;
                    --duration: 6.4s;
                    --delay: 0.4s;
                    --drift: 40px;
                    --rotation: 160deg;
                "
            >♥</span>

            <span
                class="falling-item confetti"
                style="
                    left: 43%;
                    --duration: 5.5s;
                    --delay: 1.8s;
                    --drift: -30px;
                    --rotation: 140deg;
                "
            ></span>

            <span
                class="falling-item heart"
                style="
                    left: 56%;
                    --duration: 6.8s;
                    --delay: 0.8s;
                    --drift: 25px;
                    --rotation: 200deg;
                "
            >♥</span>

            <span
                class="falling-item star"
                style="
                    left: 67%;
                    --duration: 5.9s;
                    --delay: 2s;
                    --drift: -35px;
                    --rotation: 170deg;
                "
            >✧</span>

            <span
                class="falling-item heart"
                style="
                    left: 78%;
                    --duration: 7.2s;
                    --delay: 0.2s;
                    --drift: 35px;
                    --rotation: 150deg;
                "
            >♥</span>

            <span
                class="falling-item confetti"
                style="
                    left: 91%;
                    --duration: 6.1s;
                    --delay: 1.5s;
                    --drift: -20px;
                    --rotation: 190deg;
                "
            ></span>

        </div>


        <!-- MESSAGE -->

        <section class="opening-content">

            <div class="message" id="message">

                <h1>
                    HAPPY BOYFRIEND'S DAY
                </h1>

                <p class="subtitle">
                    To the most amazing boyfriend in the world
                </p>

                <p class="love-line">
                    I love you so much ♡
                </p>

            </div>

        </section>


        <!-- =====================================================
             CURTAINS
        ====================================================== -->

        <div class="curtain-system">

            <div
                class="curtain curtain-left"
                id="leftCurtain"
            ></div>

            <div
                class="curtain curtain-right"
                id="rightCurtain"
            ></div>

        </div>

    </main>


    <script>

        /* =====================================================
           PAGE 1 — MASTER TIMELINE
        ===================================================== */

        const leftCurtain =
            document.getElementById("leftCurtain");

        const rightCurtain =
            document.getElementById("rightCurtain");

        const message =
            document.getElementById("message");

        const fallingLayer =
            document.getElementById("fallingLayer");


        /*
           IMPORTANT:

           The curtains begin CLOSED.
           Nothing is animated by CSS on first paint.

           This prevents the initial flash / missing-curtain
           problem from the old version.
        */


        /* -----------------------------------------------------
           1. WAIT TWO SECONDS
        ----------------------------------------------------- */

        setTimeout(() => {

            /*
               Open both curtains simultaneously.
            */

            leftCurtain.classList.add("open");
            rightCurtain.classList.add("open");


            /*
               Bring in falling decorations slightly after
               the curtains begin moving.
            */

            setTimeout(() => {

                fallingLayer.classList.add("visible");

            }, 650);


            /*
               Bring in the message after the curtains
               are mostly open.
            */

            setTimeout(() => {

                message.classList.add("visible");

            }, 950);

        }, 2000);


        /* -----------------------------------------------------
           2. CLOSE AFTER MESSAGE HAS BEEN SHOWN
        ----------------------------------------------------- */

        setTimeout(() => {

            /*
               Fade the message away.
            */

            message.classList.remove("visible");


            /*
               Remove falling decorations.
            */

            fallingLayer.classList.remove("visible");


            /*
               Remove the OPEN state.
               The curtains are still visually open.
            */

            leftCurtain.classList.remove("open");
            rightCurtain.classList.remove("open");


            /*
               Force a browser layout update.

               This ensures the browser sees the curtains
               in their closed position BEFORE we add
               the closing transition.
            */

            void leftCurtain.offsetWidth;
            void rightCurtain.offsetWidth;


            /*
               Now smoothly draw them shut.
            */

            leftCurtain.classList.add("closing");
            rightCurtain.classList.add("closing");

        }, 6500);


        /* -----------------------------------------------------
           3. NAVIGATE ONLY AFTER CURTAINS ARE FULLY CLOSED
        ----------------------------------------------------- */

        setTimeout(() => {

            /*
               At this exact point the entire viewport is
               covered by the curtains.

               The certificate page therefore loads
               underneath a fully covered screen.
            */

            window.location.replace("certificate.html");

        }, 6500 + 2200 + 120);

    </script>

</body>
</html>
